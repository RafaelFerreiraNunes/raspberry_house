syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.raspberry.house_raspberry_out.grpc";

service LedService {
  rpc ChangeStatus (LedRequest) returns (LedResponse) {}
}

message LedRequest {
  int32 led_id = 1;
  bool state = 2;
}

message LedResponse {
  bool success = 1;
  string message = 2;
}